# fullsend per-repo configuration
# https://github.com/fullsend-ai/fullsend
#
# This file configures fullsend for per-repo installation mode.
# See https://fullsend.sh/docs/guides/infrastructure/layered-config-reference
version: "1"
allowed_remote_resources:
    - https://raw.githubusercontent.com/fullsend-ai/fullsend/
    - https://raw.githubusercontent.com/fullsend-ai/agents/
agents:
    - name: triage
      trigger: >-
        event.transition.kind == "comment_added"
            && has(event.transition.comment.command)
            && event.transition.comment.command == "/fs-triage"
            && event.actor.kind == "human"
            && event.actor.id in [
                "willianrampazzo",
                "HozifaWasfy"
            ]
    - name: code
      trigger: >-
        event.transition.kind == "comment_added"
            && has(event.transition.comment.command)
            && event.transition.comment.command == "/fs-code"
            && event.actor.kind == "human"
            && event.actor.id in [
                "willianrampazzo",
                "HozifaWasfy"
            ]
    - name: review
      trigger: >-
        event.transition.kind == "comment_added"
            && has(event.entity.linked_change_proposal)
            && has(event.transition.comment.command)
            && event.transition.comment.command == "/fs-review"
            && event.actor.kind == "human"
            && event.actor.id in [
                "willianrampazzo",
                "HozifaWasfy"
            ]
    - name: fix
      trigger: >-
        event.transition.kind == "comment_added"
            && has(event.entity.linked_change_proposal)
            && has(event.transition.comment.command)
            && event.transition.comment.command == "/fs-fix"
            && event.actor.kind == "human"
            && event.actor.id in [
                "willianrampazzo",
                "HozifaWasfy"
            ]
    - name: prioritize
      trigger: >-
        event.transition.kind == "comment_added"
            && has(event.transition.comment.command)
            && event.transition.comment.command == "/fs-prioritize"
            && event.actor.kind == "human"
            && event.actor.id in [
                "willianrampazzo",
                "HozifaWasfy"
            ]
    - name: retro
      trigger: >-
        event.transition.kind == "comment_added"
            && has(event.transition.comment.command)
            && event.transition.comment.command == "/fs-retro"
            && event.actor.kind == "human"
            && event.actor.id in [
                "willianrampazzo",
                "HozifaWasfy"
            ]
tracker:
    github:
        allowed_targets:
            repos:
                - konflux-ci/diffused
                - fullsend-ai/fullsend
